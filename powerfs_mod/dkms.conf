# DKMS configuration for the PowerFS kernel filesystem module (powerfs.ko).
#
# Install (target machine, root):
#   ./dkms.sh install
# then load with: modprobe powerfs
#
# Prerequisites:
#   - Linux 6.17+ (the module uses 6.17 VFS APIs; see BUILD_EXCLUSIVE_KERNEL)
#   - kernel headers/build tree at /lib/modules/$(uname -r)/build
#   - the kernel must export the simple_xattr_* symbols
#     (apply kernel/patches/export-simple-xattr-symbols-linux-6.17.patch
#     when building a custom kernel)
#
# No MAKE[0]/CLEAN override: dkms's generic kbuild invocation
# (`make -C $kernel_source_dir M=$dkms_build_dir modules`) enters the
# Makefile's kbuild pass directly. RDMA (powerfs_net_rdma.o) is compiled
# when the target kernel's config has CONFIG_INFINIBAND=y/m — kbuild exposes
# it via include/config/auto.conf, same as direct developer builds.

PACKAGE_NAME="powerfs"
PACKAGE_VERSION="2.0.0"

BUILT_MODULE_NAME[0]="powerfs"
DEST_MODULE_LOCATION[0]="/updates"

# Network filesystem, mounted post-boot — no initramfs rebuild required.
REMAKE_INITRD="no"
# Rebuild automatically for newly installed kernels via the dkms apt/yum hook.
AUTOINSTALL="yes"

# Module uses 6.17+ VFS APIs; fail fast on older kernels instead of breaking
# halfway through compilation.
BUILD_EXCLUSIVE_KERNEL="^6\."
